name: Build LaunchFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LaunchFlow
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web app dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.3
          npm install @capacitor/cli@7.4.3
          npm install @capacitor/android@7.4.3

      - name: Build web app
        run: npm run build

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.launchflow.app",
            "appName": "LaunchFlow",
            "webDir": "dist"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Sync LaunchFlow into Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaunchFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
